name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .
      - name: Compile check
        run: python -m compileall -q strataforge
      - name: Run tests
        run: python -m unittest discover -s tests -t .
      - name: Doctor
        run: python -m strataforge doctor
      - name: Bench
        run: python -m strataforge bench
